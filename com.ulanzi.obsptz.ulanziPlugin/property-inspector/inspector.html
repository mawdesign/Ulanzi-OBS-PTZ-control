<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="../libs/css/uspi.css">
  <script src="../libs/js/constants.js"></script>
  <script src="../libs/js/eventEmitter.js"></script>
  <script src="../libs/js/timers.js"></script>
  <script src="../libs/js/utils.js"></script>
  <script src="../libs/js/ulanziApi.js"></script>
  <style>
    #test-result { margin-top: 6px; min-height: 1.2em; }
    #password-note, #device-note, #target-note { margin-top: 4px; opacity: 0.7; }
    #target-note { color: #f44336; }
    #test-result.ok { color: #4caf50; }
    #test-result.fail { color: #f44336; }
  </style>
</head>
<body>
  <div class="uspi-wrapper">
    <!-- Per-action options. More (direction, speed, preset, ...) land here with the feature tickets. -->
    <form id="property-inspector">
      <div class="uspi-item">
        <div class="uspi-item-label">Camera</div>
        <select class="uspi-item-value select" name="device" id="device">
          <option value="selected">Follow the selected camera</option>
        </select>
        <div id="device-note"></div>
      </div>
      <div class="uspi-item" id="preset-row" hidden>
        <div class="uspi-item-label">Preset</div>
        <select class="uspi-item-value select" name="preset" id="preset"></select>
      </div>
      <div id="target-note" role="status"></div>
    </form>

    <div class="uspi-heading">OBS connection</div>
    <form id="connection" autocomplete="off">
      <div class="uspi-item">
        <div class="uspi-item-label">Host</div>
        <input type="text" class="uspi-item-value" name="host" placeholder="localhost">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label">Port</div>
        <input type="number" class="uspi-item-value" name="port" placeholder="4455" min="1" max="65535">
      </div>
      <div class="uspi-item">
        <div class="uspi-item-label">Password</div>
        <input type="password" class="uspi-item-value" name="password" autocomplete="off">
        <div id="password-note"></div>
      </div>
      <div class="uspi-item">
        <button type="button" id="test">Test connection</button>
        <button type="button" id="clear-password" hidden>Remove saved password</button>
        <div id="test-result" role="status"></div>
      </div>
    </form>
  </div>
  <script>
    // Studio loads this page with ?uuid=&actionid=&key=&port=&address=&controller=&device= ;
    // connect() with no argument reads them, so one shared inspector serves every action.
    $UD.connect();

    const actionForm = document.getElementById('property-inspector');
    const connForm = document.getElementById('connection');
    const result = document.getElementById('test-result');

    const readConnection = () => Utils.getFormValue('#connection');

    // --- Camera: follow the camera selected in the OBS PTZ dock (default) or pin to one ---
    const deviceSelect = document.getElementById('device');
    const deviceNote = document.getElementById('device-note');
    let savedDevice = 'selected';
    let cameras = null; // last camera list from the main service

    function renderCameras() {
      deviceSelect.textContent = '';
      const add = (value, label) => deviceSelect.add(new Option(label, value));
      const sel = cameras?.devices.find((d) => d.device === cameras.selected);
      add('selected', sel ? `Follow the selected camera (${sel.name})` : 'Follow the selected camera');
      for (const d of cameras?.devices ?? []) add(d.device, d.name);
      // Never silently drop a saved camera that OBS does not currently list.
      if (savedDevice !== 'selected' && !(cameras?.devices ?? []).some((d) => d.device === savedDevice)) {
        add(savedDevice, `Unavailable camera (${savedDevice.slice(0, 8)}…)`);
      }
      deviceSelect.value = savedDevice;
      deviceNote.textContent = cameras && !cameras.connected ? 'Not connected to OBS, so cameras cannot be listed.' : '';
    }

    // --- Preset (Preset key only): chosen by name, stored by id ---
    // Studio loads this page with the action's UUID; its last part is the kind of key.
    const kind = (new URLSearchParams(location.search).get('uuid') || '').split('.').pop();
    const presetRow = document.getElementById('preset-row');
    const presetSelect = document.getElementById('preset');
    const targetNote = document.getElementById('target-note');
    presetRow.hidden = kind !== 'preset';
    let savedPreset = '';

    function renderPreset() {
      const list = cameras?.target?.presets ?? [];
      presetSelect.textContent = '';
      presetSelect.add(new Option('Choose a preset', ''));
      for (const p of list) presetSelect.add(new Option(p.name, p.id));
      // Never silently drop a saved preset that OBS no longer lists.
      if (savedPreset && !list.some((p) => p.id === savedPreset)) presetSelect.add(new Option(`Unavailable preset (${savedPreset})`, savedPreset));
      presetSelect.value = savedPreset;
    }

    // What the camera this key is set to can do: a message, and the key's own options off when it cannot.
    function renderTarget() {
      const target = cameras?.target;
      targetNote.textContent = target && !target.ok ? target.message : '';
      presetSelect.disabled = Boolean(target && !target.ok);
    }

    function loadAction(param) {
      Utils.setFormValue(param, '#property-inspector');
      savedDevice = param?.device || 'selected';
      savedPreset = param?.preset || '';
      renderCameras();
      renderPreset();
      renderTarget();
    }

    // Per-action settings (Studio stores them and hands them back via add / paramfromapp).
    $UD.onAdd((message) => loadAction(message.param));
    $UD.onParamFromApp((message) => loadAction(message.param));
    actionForm.addEventListener('change', () => {
      savedDevice = deviceSelect.value;
      savedPreset = presetSelect.value;
      $UD.sendParamFromPlugin(Utils.getFormValue('#property-inspector'));
    });

    // Connection settings are global. The password is write-only: it goes to the main service, which
    // stores it encrypted; the inspector only learns whether one is saved.
    const passwordInput = connForm.elements.password;
    const passwordNote = document.getElementById('password-note');
    const clearButton = document.getElementById('clear-password');

    $UD.onConnected(() => {
      $UD.getGlobalSettings();
      $UD.sendToPlugin({ type: 'getDevices' });
    });
    $UD.onDidReceiveGlobalSettings((message) => {
      const s = message.settings || {};
      Utils.setFormValue({ host: s.host ?? '', port: s.port ?? '' }, '#connection');
      const saved = Boolean(s.passwordEnc || s.password);
      passwordInput.value = '';
      passwordNote.textContent = saved ? 'A password is saved. Type here to replace it.' : '';
      clearButton.hidden = !saved;
    });
    connForm.addEventListener('change', () => {
      $UD.sendToPlugin({ type: 'saveConnection', settings: readConnection() });
    });
    clearButton.addEventListener('click', () => {
      $UD.sendToPlugin({ type: 'saveConnection', settings: { ...readConnection(), password: '', clearPassword: true } });
    });

    // Test connection: the main service owns the OBS socket, so ask it.
    document.getElementById('test').addEventListener('click', () => {
      result.className = '';
      result.textContent = 'Testing…';
      $UD.sendToPlugin({ type: 'testConnection', settings: readConnection() });
    });
    $UD.onSendToPropertyInspector((message) => {
      const p = message.payload;
      if (p?.type === 'devices') {
        cameras = p;
        renderCameras();
        renderPreset();
        renderTarget();
      } else if (p?.type === 'testConnectionResult') {
        result.className = p.ok ? 'ok' : 'fail';
        result.textContent = p.message;
      }
    });
  </script>
</body>
</html>
